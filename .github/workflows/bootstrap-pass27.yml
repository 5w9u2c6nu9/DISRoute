name: Bootstrap Pass 27 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify authoritative Pass 27 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          archive='DISRoute-Implementation-Pass-27-2026-08-21.zip'
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          expected='af13be5f8fddcf79c00bb4b6b8f02a9058776d84615e83de0b30b5ed49a8b1fe'
          test "$actual" = "$expected"
          unzip -tq "$archive"
          cp "$archive" /tmp/disroute-pass27.zip

      - name: Expand authoritative Pass 27 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f DISRoute-Implementation-Pass-27-2026-08-21.zip DISRoute-Pass-27-manifest.json DISRoute-Pass-27-SHA256.txt
          unzip -oq /tmp/disroute-pass27.zip -d .
          rm -f .github/workflows/bootstrap-pass27.yml

      - name: Verify expanded source shape
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -type f -not -path './.git/*' | wc -l)" -eq 281
          test "$(find src -name '*.cs' -type f | wc -l)" -eq 124
          test "$(find src -name '*.csproj' -type f | wc -l)" -eq 18
          test "$(find src/DISRoute.Data/Migrations/PostgreSql -name '*.sql' -type f | wc -l)" -eq 20

      - name: Commit authoritative Pass 27 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DISRoute Bootstrap'
          git config user.email 'disroute-bootstrap@users.noreply.github.com'
          git add -A
          git commit -m 'Establish authoritative DISRoute Pass 27 baseline'
          git push origin HEAD:main
