name: Bootstrap Pass 27 source

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and verify authoritative Pass 27 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/pass27.zip.b64.* | base64 -d > /tmp/disroute-pass27.zip
          actual="$(sha256sum /tmp/disroute-pass27.zip | awk '{print $1}')"
          expected="af13be5f8fddcf79c00bb4b6b8f02a9058776d84615e83de0b30b5ed49a8b1fe"
          test "$actual" = "$expected"
          unzip -tq /tmp/disroute-pass27.zip

      - name: Expand authoritative Pass 27 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          unzip -oq /tmp/disroute-pass27.zip -d .
          rm -f .github/workflows/bootstrap-pass27.yml

      - name: Commit authoritative Pass 27 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DISRoute Bootstrap"
          git config user.email "disroute-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "Establish authoritative DISRoute Pass 27 baseline"
          git push origin HEAD:main
