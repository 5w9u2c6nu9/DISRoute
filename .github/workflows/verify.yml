name: DISRoute verify
on:
  push:
    branches: [main, 'pass-*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
      - name: Locked restore + NuGet advisory audit
        env:
          DISROUTE_ENABLE_NUGET_AUDIT: 'true'
        run: dotnet restore DISRoute.slnx --locked-mode -m:1
      - name: Release build
        run: dotnet build DISRoute.slnx -c Release --no-restore -m:1
      - name: SelfTest
        run: dotnet run --project src/DISRoute.SelfTest/DISRoute.SelfTest.csproj -c Release --no-build
      - name: Source verifier
        run: python3 scripts/verify-source.py
