services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: disroute
      POSTGRES_USER: disroute
      POSTGRES_PASSWORD: disroute-development-only
    ports:
      - "5432:5432"
    volumes:
      - disroute-postgres:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disroute -d disroute"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  disroute-postgres:
